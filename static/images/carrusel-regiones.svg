<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="punaMtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="quebradaMtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="vallesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="yungasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="60%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="800" height="420" fill="url(#skyGrad)"/>

  <!-- Sol Andino -->
  <circle cx="680" cy="90" r="50" fill="#FBBF24" opacity="0.85"/>
  <circle cx="680" cy="90" r="64" fill="#FDE68A" opacity="0.35"/>

  <!-- Montañas de la Puna (Fondo alto) -->
  <polygon points="40,280 180,100 320,280" fill="url(#punaMtn)" opacity="0.9"/>
  <polygon points="120,280 260,120 400,280" fill="#7C2D12" opacity="0.75"/>
  <polygon points="260,280 410,130 560,280" fill="url(#punaMtn)" opacity="0.85"/>

  <!-- Serranías de la Quebrada (Capas de colores) -->
  <path d="M0,310 Q140,190 280,260 T560,230 T800,280 L800,420 L0,420 Z" fill="url(#quebradaMtn)"/>
  <path d="M0,325 Q130,230 290,280 T590,255 T800,300 L800,420 L0,420 Z" fill="#92400E" opacity="0.6"/>

  <!-- Valles Fértiles (Campos cultivados en surcos) -->
  <path d="M0,335 Q200,280 450,330 T800,310 L800,420 L0,420 Z" fill="url(#vallesGrad)"/>
  <!-- Líneas de riego y cultivo -->
  <line x1="80" y1="360" x2="320" y2="420" stroke="#86EFAC" stroke-width="2.5" opacity="0.5"/>
  <line x1="140" y1="355" x2="400" y2="420" stroke="#86EFAC" stroke-width="2.5" opacity="0.5"/>
  <line x1="200" y1="350" x2="480" y2="420" stroke="#86EFAC" stroke-width="2.5" opacity="0.5"/>

  <!-- Vegetación de Yungas (Selva subtropical a la derecha) -->
  <path d="M480,420 Q560,310 660,330 T800,320 L800,420 Z" fill="url(#yungasGrad)"/>
  <!-- Siluetas de árboles y hojas -->
  <circle cx="560" cy="330" r="32" fill="#047857"/>
  <circle cx="610" cy="320" r="38" fill="#065F46"/>
  <circle cx="670" cy="315" r="42" fill="#047857"/>
  <circle cx="730" cy="310" r="45" fill="#064E3B"/>
  <circle cx="780" cy="320" r="36" fill="#047857"/>

  <!-- Insignia Flotante: Las 4 Regiones -->
  <g filter="url(#shadow)" transform="translate(40, 40)">
    <rect width="320" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="0" y="0" width="8" height="74" rx="4" fill="#059669"/>
    <text x="26" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857" letter-spacing="0.08em">TERRITORIO AGROPECUARIO</text>
    <text x="26" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#173F32">Puna • Quebrada • Valles • Yungas</text>
  </g>
</svg>
