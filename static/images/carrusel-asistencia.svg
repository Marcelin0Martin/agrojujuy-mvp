<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="chatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="420" fill="url(#chatBg)"/>

  <!-- Líneas Dinámicas de Conexión (Ondas) -->
  <path d="M-50,260 Q200,160 400,240 T850,200" fill="none" stroke="#34D399" stroke-width="2" opacity="0.3"/>
  <path d="M-50,290 Q220,190 420,270 T850,230" fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.2"/>

  <!-- Burbuja 1: Consulta del Productor (Izquierda) -->
  <g filter="url(#chatShadow)" transform="translate(70, 75)">
    <rect width="320" height="135" rx="18" fill="#FFFFFF"/>
    <!-- Flecha de chat -->
    <polygon points="40,135 60,135 30,155" fill="#FFFFFF"/>
    <circle cx="45" cy="40" r="18" fill="#FEF3C7"/>
    <!-- Icono tractor -->
    <path d="M38 43 L49 43 M46 33 L46 39 M34 35 L43 35 L44 41" stroke="#D97706" stroke-width="2" fill="none"/>
    <circle cx="39" cy="45" r="3" fill="#D97706"/>
    <circle cx="48" cy="45" r="2" fill="#D97706"/>

    <text x="74" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97706">PRODUCTOR EN LOTE</text>
    <text x="74" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#173F32">Consulta de Asistencia Técnica</text>
    <text x="30" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4B5563">«Detecté amarillamiento foliar y manchas en</text>
    <text x="30" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4B5563">el cultivo de pimiento. ¿Qué tratamiento aplico?»</text>
  </g>

  <!-- Burbuja 2: Diagnóstico del Ingeniero Agrónomo (Derecha) -->
  <g filter="url(#chatShadow)" transform="translate(410, 195)">
    <rect width="330" height="150" rx="18" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <!-- Flecha de chat -->
    <polygon points="280,0 300,0 310,-20" fill="#F0FDF4"/>
    <circle cx="45" cy="40" r="18" fill="#DBEAFE"/>
    <!-- Icono birrete -->
    <path d="M35 37 L45 32 L55 37 L45 42 Z" fill="#2563EB"/>
    <path d="M39 40 L39 46 C39 49 51 49 51 46 L51 40" fill="#1D4ED8"/>

    <text x="74" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563EB">INGENIERO AGRÓNOMO CIAPAJ</text>
    <text x="74" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#065F46">Diagnóstico y Plan de Manejo</text>
    <text x="30" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#047857">«Compatible con deficiencia de hierro por pH alto.</text>
    <text x="30" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#047857">Suspende agroquímicos y aplica quelato quelatado.»</text>

    <!-- Badge de Cierre Técnico -->
    <rect x="30" y="118" width="170" height="22" rx="11" fill="#10B981"/>
    <text x="45" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">✔ Cierre Técnico Verificado</text>
  </g>

  <!-- Centro: Icono de Articulación Inmediata -->
  <g filter="url(#chatShadow)" transform="translate(370, 180)">
    <circle cx="30" cy="30" r="30" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Dos flechas en círculo -->
    <path d="M22 28 A10 10 0 0 1 38 22 L38 26" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M38 32 A10 10 0 0 1 22 38 L22 34" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
