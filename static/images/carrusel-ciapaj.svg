<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="ciapajBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D23"/>
      <stop offset="50%" stop-color="#173F32"/>
      <stop offset="100%" stop-color="#1E5242"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ciapajShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo Institucional -->
  <rect width="800" height="420" fill="url(#ciapajBg)"/>

  <!-- Tramas y Líneas Técnicas de Certificación -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="400" cy="210" r="160" fill="none"/>
    <circle cx="400" cy="210" r="210" fill="none" stroke-dasharray="8 8"/>
    <circle cx="400" cy="210" r="260" fill="none"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
  </g>

  <!-- Escudo Central Institucional CIAPAJ -->
  <g filter="url(#ciapajShadow)" transform="translate(400, 205)">
    <!-- Escudo Base -->
    <path d="M0,-110 C80,-110 120,-80 120,10 C120,95 30,135 0,150 C-30,135 -120,95 -120,10 C-120,-80 -80,-110 0,-110 Z" fill="#0D221B" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Escudo Interior -->
    <path d="M0,-96 C68,-96 104,-70 104,8 C104,82 26,120 0,134 C-26,120 -104,82 -104,8 C-104,-70 -68,-96 0,-96 Z" fill="#14392D"/>

    <!-- Birrete Académico (Ingeniería) -->
    <path d="M0,-45 L50,-24 L0,-3 L-50,-24 Z" fill="#60A5FA"/>
    <path d="M-36,-17 L-36,5 C-36,18 36,18 36,5 L36,-17" fill="#3B82F6"/>
    <path d="M50,-24 L56,4 L53,16" stroke="#93C5FD" stroke-width="2" fill="none"/>
    <circle cx="53" cy="18" r="3" fill="#FCD34D"/>

    <!-- Espiga de Trigo / Símbolo Agronómico -->
    <g transform="translate(0, 48)">
      <line x1="0" y1="-28" x2="0" y2="26" stroke="#FBBF24" stroke-width="3"/>
      <!-- Granos -->
      <ellipse cx="-12" cy="-18" rx="8" ry="4" transform="rotate(-30 -12 -18)" fill="#FCD34D"/>
      <ellipse cx="12" cy="-18" rx="8" ry="4" transform="rotate(30 12 -18)" fill="#FCD34D"/>
      <ellipse cx="-12" cy="-5" rx="8" ry="4" transform="rotate(-30 -12 -5)" fill="#FCD34D"/>
      <ellipse cx="12" cy="-5" rx="8" ry="4" transform="rotate(30 12 -5)" fill="#FCD34D"/>
      <ellipse cx="-12" cy="8" rx="8" ry="4" transform="rotate(-30 -12 8)" fill="#FCD34D"/>
      <ellipse cx="12" cy="8" rx="8" ry="4" transform="rotate(30 12 8)" fill="#FCD34D"/>
    </g>

    <!-- Checkmark de Habilitación Oficial -->
    <circle cx="85" cy="85" r="26" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M75,85 L82,92 L95,78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Tarjeta Lateral Izquierda: Matrícula Protegida -->
  <g filter="url(#ciapajShadow)" transform="translate(60, 160)">
    <rect width="210" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="0.08em">PADRÓN OFICIAL</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#173F32">Matrícula Provincial</text>
    <text x="20" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6B7280">Ley Provincial N° 4135</text>
  </g>

  <!-- Tarjeta Lateral Derecha: Ética y Calidad -->
  <g filter="url(#ciapajShadow)" transform="translate(530, 160)">
    <rect width="210" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="0.08em">AUDITORÍA ACTIVA</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#173F32">CIAPAJ Jujuy</text>
    <text x="20" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6B7280">100% Profesionales Validados</text>
  </g>
</svg>
