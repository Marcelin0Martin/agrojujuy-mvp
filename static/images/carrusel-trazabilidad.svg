<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="trazaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="trazaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="420" fill="url(#trazaBg)"/>

  <!-- Cuadrícula Catastral y Georreferenciación (GPS) -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <!-- Polígonos de Parcelas Agrarias Iluminadas -->
  <polygon points="100,80 250,80 250,180 100,180" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="2"/>
  <polygon points="250,180 400,180 400,280 250,280" fill="#0EA5E9" fill-opacity="0.18" stroke="#0EA5E9" stroke-width="2"/>
  <polygon points="550,80 700,80 700,280 550,180" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2"/>

  <!-- Marcador GPS Principal en Parcela -->
  <g transform="translate(175, 120)">
    <circle cx="0" cy="0" r="18" fill="#10B981" opacity="0.3"/>
    <path d="M0 -22 C-10 -22 -16 -14 -16 -4 C-16 10 0 24 0 24 C0 24 16 10 16 -4 C16 -14 10 -22 0 -22 Z" fill="#EF4444"/>
    <circle cx="0" cy="-6" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Tarjeta Central: Pasaporte Sanitario RENSPA -->
  <g filter="url(#trazaShadow)" transform="translate(230, 95)">
    <rect width="340" height="230" rx="20" fill="#FFFFFF"/>
    <!-- Cabecera de Tarjeta -->
    <path d="M0 20 C0 9 9 0 20 0 L320 0 C331 0 340 9 340 20 L340 60 L0 60 Z" fill="#173F32"/>
    <text x="25" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#86EFAC" letter-spacing="0.08em">CERTIFICACIÓN INSTITUCIONAL</text>
    <text x="25" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Trazabilidad Sanitaria RENSPA</text>

    <!-- Datos Protegidos -->
    <g transform="translate(25, 80)">
      <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6B7280">NÚMERO RENSPA OFICIAL</text>
      <text x="0" y="35" font-family="monospace" font-size="15" font-weight="800" fill="#173F32">09.004.0.10428/00</text>

      <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6B7280">TITULAR REGISTRADO</text>
      <text x="0" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#173F32">DNI Validado • Finca Productiva Jujuy</text>

      <!-- Código de Barras / QR Simulado -->
      <g transform="translate(0, 100)" fill="#173F32">
        <rect x="0" y="0" width="3" height="30"/>
        <rect x="6" y="0" width="2" height="30"/>
        <rect x="11" y="0" width="4" height="30"/>
        <rect x="18" y="0" width="1" height="30"/>
        <rect x="22" y="0" width="5" height="30"/>
        <rect x="30" y="0" width="2" height="30"/>
        <rect x="35" y="0" width="3" height="30"/>
        <rect x="42" y="0" width="6" height="30"/>
        <rect x="51" y="0" width="2" height="30"/>
        <rect x="56" y="0" width="4" height="30"/>
        <rect x="63" y="0" width="1" height="30"/>
        <rect x="67" y="0" width="3" height="30"/>
        <rect x="73" y="0" width="5" height="30"/>
        <rect x="82" y="0" width="2" height="30"/>
        <rect x="87" y="0" width="4" height="30"/>
      </g>
      <text x="105" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">✔ Validado SENASA</text>
    </g>

    <!-- Candado de Seguridad de Datos -->
    <circle cx="300" cy="180" r="22" fill="#FEF3C7"/>
    <!-- Candado -->
    <rect x="293" y="174" width="14" height="12" rx="2" fill="#D97706"/>
    <path d="M296 174 L296 170 C296 167 304 167 304 170 L304 174" stroke="#D97706" stroke-width="2" fill="none"/>
  </g>
</svg>
