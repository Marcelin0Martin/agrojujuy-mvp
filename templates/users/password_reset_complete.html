{% extends 'base.html' %}

{% block title %}Contraseña Restablecida — AgroJujuy{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto; text-align: center;">
    <div class="card rounded-2xl shadow-md p-8" style="border-top: 5px solid var(--color-secondary);">
        <div aria-hidden="true" style="font-size: 3rem; margin-bottom: 0.75rem;">✅</div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--color-primary); margin-bottom: 0.75rem;">
            Contraseña Actualizada con Éxito
        </h1>
        <p style="font-size: 0.95rem; color: var(--color-text-muted); margin-bottom: 1.5rem;">
            Tu nueva contraseña ya está activa. Ahora puedes iniciar sesión en AgroJujuy.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Ir a Iniciar Sesión</a>
    </div>
</div>
{% endblock %}
